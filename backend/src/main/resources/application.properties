spring.application.name=ban-ao-phong
server.port=8080
server.servlet.context-path=/

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Thymeleaf
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# Upload file
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=uploads/images

server.servlet.session.timeout=30m

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.default-encoding=UTF-8

# VNPay - Official Sandbox Credentials (Updated 27/02/2026)
vnpay.tmnCode=${VNPAY_TMN_CODE:}
vnpay.hashSecret=${VNPAY_HASH_SECRET:}
vnpay.payUrl=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.returnUrl=${VNPAY_RETURN_URL:http://localhost:8080/api/vnpay-return}
vnpay.apiUrl=${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}

# GHN - Giao Hàng Nhanh
ghn.apiUrl=${GHN_API_URL:https://dev-online-gateway.ghn.vn/shiip/public-api/v2}
ghn.token=${GHN_TOKEN:}
ghn.shopId=${GHN_SHOP_ID:}
# GHN warehouse location (Hoài Đức, Hà Nội)
ghn.warehouseDistrictId=1452
ghn.warehouseWardCode=20881

app.hoadon.soLuongChoToiDa=5
app.hoadon.thoiGianTuHuy=120
app.sanpham.soLuongMuaToiDa=5

app.shop.soDienThoai=${SHOP_PHONE:}
app.shop.ten=${SHOP_NAME:CertainShop}
app.shop.diaChi=${SHOP_ADDRESS:}

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000
app.jwt.refreshExpiration=604800000

# CORS - allow React dev server
app.cors.allowedOrigins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# React FE URL for VNPay callback redirect
app.fe.url=${APP_FE_URL:http://localhost:5173}

# Logging
logging.level.com.certainshop=DEBUG
logging.level.org.springframework.security=DEBUG

# Rate limiting (per process and remote IP)
app.rate-limit.auth.max-attempts=${AUTH_RATE_LIMIT_MAX:10}
app.rate-limit.auth.window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
app.rate-limit.public.max-requests=${PUBLIC_RATE_LIMIT_MAX:120}
app.rate-limit.public.window-seconds=${PUBLIC_RATE_LIMIT_WINDOW_SECONDS:60}
